<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10151c">
  <title>Voice AI — Tester le modèle STT</title>
  <style>
    :root { color-scheme: dark; --bg:#10151c; --panel:#19212b; --line:#2b3948; --muted:#9aa9b8; --text:#edf4fa; --accent:#73e0bd; --danger:#ff9188; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; padding:48px 20px; background:radial-gradient(ellipse at 50% -10%,#233b45 0,transparent 50%),var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif }
    main { width:min(760px,100%); margin:0 auto }
    .eyebrow { color:var(--accent); font-size:.78rem; font-weight:750; letter-spacing:.14em; text-transform:uppercase }
    h1 { margin:8px 0; font-size:clamp(2rem,6vw,3.2rem); letter-spacing:-.045em; line-height:1.1 }
    .intro { margin:0 0 28px; color:var(--muted) }
    .card { padding:24px; border:1px solid var(--line); border-radius:20px; background:color-mix(in srgb,var(--panel) 92%,transparent); box-shadow:0 24px 70px #0003 }
    .status { display:flex; align-items:center; gap:10px; margin-bottom:22px; color:var(--muted); font-size:.9rem }
    .dot { width:9px; height:9px; border-radius:50%; background:#788694; box-shadow:0 0 0 4px #78869422 }
    .dot.ok { background:var(--accent); box-shadow:0 0 0 4px #73e0bd22 }
    .dot.bad { background:var(--danger); box-shadow:0 0 0 4px #ff918822 }
    .drop { display:grid; min-height:180px; place-items:center; padding:24px; border:1px dashed #536779; border-radius:14px; text-align:center; cursor:pointer; transition:.18s ease }
    .drop:hover,.drop.over { border-color:var(--accent); background:#73e0bd0b }
    .drop strong { display:block; margin:8px 0 2px; font-size:1.05rem }
    .drop span { color:var(--muted); font-size:.88rem }
    .icon { color:var(--accent); font-size:1.8rem }
    input[type=file] { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0) }
    .selected { display:none; margin:14px 0 0; color:var(--muted); font-size:.9rem; overflow-wrap:anywhere }
    audio { display:none; width:100%; height:42px; margin-top:14px }
    button { display:flex; width:100%; justify-content:center; align-items:center; gap:9px; margin-top:20px; padding:13px 18px; border:0; border-radius:11px; background:var(--accent); color:#0d201b; font:700 1rem inherit; font-weight:750; cursor:pointer; transition:.18s ease }
    button:hover:not(:disabled) { background:#9af0d5; transform:translateY(-1px) }
    button:disabled { cursor:not-allowed; opacity:.48 }
    .result { display:none; margin-top:20px; padding:20px; border:1px solid var(--line); border-radius:14px; background:#111820 }
    .result h2 { margin:0 0 8px; color:var(--muted); font-size:.78rem; letter-spacing:.1em; text-transform:uppercase }
    #transcript { min-height:1.5em; margin:0; font-size:1.2rem; overflow-wrap:anywhere; white-space:pre-wrap }
    .error { display:none; margin-top:14px; color:var(--danger); font-size:.92rem }
    .foot { margin-top:18px; color:var(--muted); font-size:.82rem }
    .spinner { display:none; width:16px; height:16px; border:2px solid #0d201b55; border-top-color:#0d201b; border-radius:50%; animation:spin .7s linear infinite }
    button.busy .spinner { display:block } button.busy .mic { display:none }
    @keyframes spin { to { transform:rotate(360deg) } }
    @media(max-width:520px) { body { padding:30px 14px } .card { padding:18px } }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Voice AI · Laboratoire vocal</div>
    <h1>Teste ton modèle STT</h1>
    <p class="intro">Dépose un enregistrement et obtiens sa transcription avec ton modèle entraîné.</p>
    <section class="card" aria-label="Transcription audio">
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Vérification du modèle…</span></div>
      <label class="drop" id="dropZone" for="audioFile">
        <span><span class="icon">↑</span><strong>Choisis un fichier audio</strong><span>ou glisse-le ici · WAV, FLAC, OGG, MP3</span></span>
      </label>
      <input id="audioFile" type="file" accept="audio/*,.wav,.flac,.ogg,.mp3">
      <div class="selected" id="fileName"></div>
      <audio id="preview" controls></audio>
      <button id="transcribe" disabled><span class="spinner"></span><span class="mic">◉</span><span id="buttonText">Transcrire l’audio</span></button>
      <div class="error" id="error" role="alert"></div>
      <div class="result" id="result" aria-live="polite"><h2>Transcription</h2><p id="transcript"></p></div>
      <div class="foot">L’audio est traité par l’API locale et n’est pas enregistré.</div>
    </section>
  </main>
  <script>
    const fileInput = document.querySelector('#audioFile');
    const dropZone = document.querySelector('#dropZone');
    const button = document.querySelector('#transcribe');
    const preview = document.querySelector('#preview');
    let selectedFile = null;

    async function checkHealth() {
      const dot = document.querySelector('#statusDot');
      const text = document.querySelector('#statusText');
      try {
        const response = await fetch('/health');
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'Le modèle ne peut pas être chargé.');
        dot.className = 'dot ok';
        text.textContent = `Modèle prêt · ${data.device.toUpperCase()} · ${data.model.split(/[\\/]/).pop()}`;
      } catch (error) {
        dot.className = 'dot bad';
        text.textContent = 'API ou checkpoint indisponible';
        showError(error.message);
      }
    }
    function showError(message) { const el=document.querySelector('#error'); el.textContent=message; el.style.display='block'; }
    function setFile(file) {
      if (!file) return;
      selectedFile = file;
      document.querySelector('#fileName').textContent = `${file.name} · ${(file.size / 1024 / 1024).toFixed(2)} Mo`;
      document.querySelector('#fileName').style.display = 'block';
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      button.disabled = false;
      document.querySelector('#error').style.display = 'none';
      document.querySelector('#result').style.display = 'none';
    }
    fileInput.addEventListener('change', () => setFile(fileInput.files[0]));
    for (const event of ['dragenter','dragover']) dropZone.addEventListener(event, e => { e.preventDefault(); dropZone.classList.add('over'); });
    for (const event of ['dragleave','drop']) dropZone.addEventListener(event, e => { e.preventDefault(); dropZone.classList.remove('over'); });
    dropZone.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));
    button.addEventListener('click', async () => {
      if (!selectedFile) return;
      button.disabled = true; button.classList.add('busy');
      document.querySelector('#buttonText').textContent = 'Transcription en cours…';
      document.querySelector('#error').style.display = 'none';
      try {
        const form = new FormData(); form.append('audio', selectedFile);
        const response = await fetch('/stt/transcribe', { method:'POST', body:form });
        const data = await response.json();
        if (!response.ok) throw new Error(data.detail || 'La transcription a échoué.');
        document.querySelector('#transcript').textContent = data.text || '(aucun texte reconnu)';
        document.querySelector('#result').style.display = 'block';
      } catch (error) { showError(error.message); }
      finally { button.disabled = false; button.classList.remove('busy'); document.querySelector('#buttonText').textContent='Transcrire l’audio'; }
    });
    checkHealth();
  </script>
</body>
</html>
